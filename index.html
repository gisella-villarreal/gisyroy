        .lightbox {

            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: rgba(20, 20, 20, 0.95); 
            backdrop-filter: blur(5px); 
        }

        .lightbox-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .lightbox-content {
            max-width: 85vw; 
            max-height: 85vh; 
            border-radius: 8px;

            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            animation-name: zoom;
            animation-duration: 0.3s;
            user-select: none; 
        }

        @keyframes zoom {
            from {transform: scale(0.9); opacity: 0;} 
            to {transform: scale(1); opacity: 1;}
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 40px;
